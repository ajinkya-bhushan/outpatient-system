[project]
name = "sst-model-evaluation"
version = "0.1.0"
description = "Production-ready Speech-to-Text model evaluation and benchmarking framework"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Internal R&D" }]
keywords = ["speech-to-text", "whisper", "evaluation", "benchmarking", "fastapi"]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Pydantic v2 + settings management
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Environment / secrets
    "python-dotenv>=1.0.0",
    # Audio processing
    "ffmpeg-python>=0.2.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    # Whisper (local inference)
    "openai-whisper>=20231106",
    # PyTorch - CPU by default; GPU users replace torch with torch+cu121
    "torch>=2.0.0",
    # HTTP client (Streamlit uploads, health checks)
    "httpx>=0.27.0",
    # WebSocket client support
    "websockets>=12.0",
    # Structured logging
    "loguru>=0.7.0",
    # Multipart form data
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
# Note: whisperflow pins fastapi==0.108.0 which conflicts with our fastapi>=0.111.0.
# Install WhisperFlow manually in a separate step AFTER the main sync:
#   uv pip install whisperflow --no-deps
#   (or omit WhisperFlow entirely and use the Whisper engine for live transcription)

openai = [
    "openai>=1.0.0",
]
# Faster-Whisper engine (GPU-optimised)
faster = [
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
]
# UI layer
ui = [
    "streamlit>=1.35.0",
]
# Note: 'live' (whisperflow) is excluded from 'all' because whisperflow pins
# fastapi==0.108.0. Install it separately: uv sync --extra live
all = [
    "sst-model-evaluation[openai,faster,ui]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",          # TestClient dependency
    "websockets>=12.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# [tool.uv] section intentionally empty – dev deps live in [dependency-groups]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode       = "auto"
testpaths          = ["tests"]
log_cli            = true
log_cli_level      = "INFO"
markers = [
    "real_model: requires actual Whisper model weights (skipped in CI)",
    "integration: requires a running server",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py311"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version    = "3.11"
strict            = false
ignore_missing_imports = true
