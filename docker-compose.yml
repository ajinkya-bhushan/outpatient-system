name: outpatient-system

services:
  minio:
    image: minio/minio:latest
    container_name: outpatient-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docconnect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docconnect-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Set to false for a lean image that proxies to sst_v1 instead of
        # running SpeechBrain and Whisper in-process (STT_ENGINE_MODE=remote).
        INSTALL_STT: "true"
        # Set when the host GPU needs a CUDA build other than the PyPI default,
        # e.g. https://download.pytorch.org/whl/cu128 for Blackwell cards.
        TORCH_INDEX_URL: ""
    image: outpatient-backend:latest
    container_name: outpatient-backend
    restart: unless-stopped
    env_file:
      - .env
      - database/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "10200"
      OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
    ports:
      - "10200:10200"
    volumes:
      # Encounter audio and transcription results. This is PHI: back it up and
      # encrypt it like any other patient data store, and see
      # backend/docs/STT_DIARIZATION_API.md for the unresolved retention
      # question.
      - backend-audio:/app/backend/data/audio
      # Model weights, several GB. A named volume keeps them across rebuilds so
      # the container does not re-download on every deploy.
      - backend-models:/app/backend/data/models
    # Requires the NVIDIA container runtime on the host. On a CPU-only host,
    # delete this block and set STT_DEVICE=cpu: the engine also falls back to
    # CPU on its own, but reserving a GPU that does not exist fails the whole
    # `compose up`.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:10200
    image: outpatient-frontend:latest
    container_name: outpatient-frontend
    restart: unless-stopped
    ports:
      - "10100:10100"

volumes:
  backend-audio:
  backend-models:
  minio-data:
